name: e2e-smoke

# End-to-end smoke gate for the UI. Runs against a STATIC build (VITE_STATIC=1)
# that reads bundled demo fixtures — no backend, no Clerk keys, no paid run — so
# it's cheap enough to gate every frontend change. See frontend/playwright.config.ts.

on:
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
